<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protected Report</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0A0A0F;--card:#111118;--ink:#e6e8ee;--mut:#9aa0ad;--acc:#58a6ff;--line:#22232c;
--decide:#22c55e;--owner:#eab308;--legal:#ef4444;--t1:#58a6ff;--t2:#a78bfa;--t3:#6b7280;--us:#fb923c;}
html[data-theme=light]{--bg:#f6f7f9;--card:#ffffff;--ink:#14161c;--mut:#5b6270;--acc:#3b5bdb;--line:#e6e8ee;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 96px}
a{color:var(--acc)}
/* Gate */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
background:radial-gradient(1200px 600px at 50% -10%,rgba(88,166,255,.12),transparent),var(--bg);z-index:50}
.lock{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;
padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.lock h1{font-size:19px;margin:0 0 6px}
.lock p{color:var(--mut);font-size:13.5px;margin:0 0 18px}
.lock input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
background:var(--bg);color:var(--ink);font-size:15px;outline:none}
.lock input:focus{border-color:var(--acc)}
.lock button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:var(--acc);
color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.lock .err{color:var(--legal);font-size:13px;margin-top:12px;min-height:18px}
.lockicon{font-size:26px}
/* Toolbar */
#bar{position:sticky;top:0;z-index:20;display:none;gap:8px;align-items:center;justify-content:flex-end;
padding:10px 14px;background:color-mix(in srgb,var(--bg) 82%,transparent);
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bar .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#bar .seg button{background:transparent;color:var(--mut);border:0;padding:7px 13px;font-size:13px;
font-weight:600;cursor:pointer}
#bar .seg button.on{background:var(--acc);color:#fff}
#bar .ic{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;
padding:7px 11px;font-size:14px;cursor:pointer}
/* Content */
#doc{display:none}
.rpt-head h1{font-size:27px;line-height:1.2;margin:6px 0 6px}
.rpt-head .sub{color:var(--mut);font-size:14px;margin-bottom:8px}
.disclaimer{background:color-mix(in srgb,var(--legal) 10%,var(--card));border:1px solid color-mix(in srgb,var(--legal) 35%,var(--line));
border-radius:12px;padding:12px 16px;font-size:13px;color:var(--ink);margin:14px 0 26px}
h2{font-size:21px;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:20px 0 8px}
p{margin:10px 0}
ul,ol{margin:10px 0;padding-left:22px}
li{margin:6px 0}
.lead{font-size:16.5px}
.legend{font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:12px 16px;margin:6px 0 8px}
.callout{background:color-mix(in srgb,var(--acc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));
border-left:4px solid var(--acc);border-radius:10px;padding:12px 16px;margin:16px 0}
.decision{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 20px 16px;margin:16px 0}
.decision h3{border-top:0}
.gate{background:color-mix(in srgb,var(--legal) 8%,transparent);border-left:3px solid var(--legal);
padding:8px 14px;border-radius:8px;font-size:14px}
.legalbasis{background:color-mix(in srgb,var(--acc) 7%,transparent);border-left:3px solid var(--acc);
padding:8px 14px;border-radius:8px;font-size:13.5px;color:var(--ink)}
.uslead{background:color-mix(in srgb,var(--us) 9%,transparent);border-left:3px solid var(--us);
padding:8px 14px;border-radius:8px;font-size:13.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;
border-radius:999px;vertical-align:middle;white-space:nowrap}
.tag-decide{background:color-mix(in srgb,var(--decide) 22%,transparent);color:var(--decide);border:1px solid var(--decide)}
.tag-owner{background:color-mix(in srgb,var(--owner) 20%,transparent);color:var(--owner);border:1px solid var(--owner)}
.tag-legal{background:color-mix(in srgb,var(--legal) 18%,transparent);color:var(--legal);border:1px solid var(--legal)}
.tier{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:2px}
.tier1{background:color-mix(in srgb,var(--t1) 20%,transparent);color:var(--t1);border:1px solid var(--t1)}
.tier2{background:color-mix(in srgb,var(--t2) 20%,transparent);color:var(--t2);border:1px solid var(--t2)}
.tier3{background:color-mix(in srgb,var(--t3) 22%,transparent);color:var(--t3);border:1px solid var(--t3)}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card);font-weight:600}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}
@media (max-width:560px){.wrap{padding:20px 14px 72px}.rpt-head h1{font-size:22px}h2{font-size:19px}}
@media print{#bar{display:none!important}#gate{display:none!important}#doc{display:block!important}
body{background:#fff;color:#000}.decision,.callout{break-inside:avoid}}
</style>
</head>
<body>
<div id="gate">
  <form class="lock" id="lockform">
    <div class="lockicon">&#128274;</div>
    <h1>Protected report</h1>
    <p>This document is end-to-end encrypted (AES-256-GCM). Enter the password to decrypt it in your browser. Nothing is sent to any server.</p>
    <input id="pw" type="password" autocomplete="off" autofocus placeholder="Password" aria-label="Password">
    <button type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="bar">
  <div class="seg" id="lang">
    <button data-l="en" class="on">EN</button><button data-l="ro">RO</button>
  </div>
  <button class="ic" id="theme" title="Toggle theme">&#9788;</button>
  <button class="ic" id="print" title="Print / PDF">&#128424;</button>
</div>

<div class="wrap"><div id="doc">
  <div class="rpt-head">
    <h1 id="rtitle"></h1>
    <div class="sub" id="rsub"></div>
  </div>
  <div class="disclaimer" id="rdisc"></div>
  <div id="report"></div>
  <div class="foot" id="rfoot"></div>
</div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let DATA=null,LANG="en";
const DISC={
 en:"Illustrative regulatory context for business planning — not legal advice. Instrument numbers/articles reflect public sources verified as of July 2026 and may change. Every jurisdiction-specific question and all operational decisions must be reviewed and approved by qualified legal counsel licensed in the relevant jurisdiction before any reliance.",
 ro:"Context de reglementare ilustrativ pentru planificarea afacerii — nu constituie consultanță juridică. Numerele/articolele actelor normative reflectă surse publice verificate la iulie 2026 și se pot schimba. Fiecare întrebare specifică unei jurisdicții și toate deciziile operaționale trebuie revizuite și aprobate de un avocat calificat, autorizat în jurisdicția relevantă, înainte de orice utilizare."
};
const FOOT={
 en:"Encrypted delivery · full plaintext copy retained locally · EU + UAE scope · US = leading-indicator only. Publishing/syncing to any external system needs owner confirmation.",
 ro:"Livrare criptată · copie completă în text clar păstrată local · domeniu UE + EAU · SUA = doar indicator-avansat. Publicarea/sincronizarea către orice sistem extern necesită confirmarea proprietarului."
};
function render(){
 if(!DATA)return;
 document.documentElement.lang=LANG;
 document.getElementById("rtitle").innerHTML=DATA["title_"+LANG];
 document.getElementById("rsub").innerHTML=DATA["sub_"+LANG];
 document.getElementById("rdisc").textContent=DISC[LANG];
 document.getElementById("report").innerHTML=DATA[LANG];
 document.getElementById("rfoot").textContent=FOOT[LANG];
 document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
}
async function unlock(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
   km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
 return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("lockform").addEventListener("submit",async e=>{
 e.preventDefault();
 const err=document.getElementById("err");err.textContent="";
 const pw=document.getElementById("pw").value;
 try{
   DATA=await unlock(pw);
   render();
   document.getElementById("gate").style.display="none";
   document.getElementById("bar").style.display="flex";
   document.getElementById("doc").style.display="block";
 }catch(_){err.textContent="Wrong password — could not decrypt.";}
});
document.getElementById("lang").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;LANG=b.dataset.l;render();
});
document.getElementById("theme").addEventListener("click",()=>{
 const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";
});
document.getElementById("print").addEventListener("click",()=>window.print());
</script>
