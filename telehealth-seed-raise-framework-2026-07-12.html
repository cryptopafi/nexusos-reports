<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Protected business document</title>
<style>
:root{--bg:#0A0A0F;--card:#111118;--ink:#e6e8ee;--mut:#9aa0ad;--acc:#58a6ff;--line:#22232c;--good:#22c55e;--warn:#eab308;--bad:#ef4444}
html[data-theme=light]{--bg:#f6f7f9;--card:#fff;--ink:#14161c;--mut:#5b6270;--acc:#3b5bdb;--line:#e6e8ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 100px}
a{color:var(--acc)}
h1{font-size:30px;line-height:1.2;margin:28px 0 8px;letter-spacing:-.4px}
h2{font-size:23px;margin:40px 0 10px;padding-top:18px;border-top:1px solid var(--line);letter-spacing:-.3px}
h3{font-size:18.5px;margin:26px 0 8px}
h4{font-size:16px;margin:20px 0 6px;color:var(--mut)}
p,li{color:var(--ink)}
blockquote{margin:16px 0;padding:12px 16px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 10px 10px 0;color:var(--mut)}
code{background:color-mix(in srgb,var(--acc) 12%,transparent);padding:1.5px 6px;border-radius:6px;font:13.5px/1.5 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
pre code{background:none;padding:0}
hr{border:0;border-top:1px solid var(--line);margin:34px 0}
.tablewrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:color-mix(in srgb,var(--acc) 10%,transparent);font-weight:650;white-space:nowrap}
tr:last-child td{border-bottom:0}
strong{color:var(--ink);font-weight:680}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1100px 560px at 50% -10%,rgba(88,166,255,.14),transparent),var(--bg);z-index:50}
.lock{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:430px;width:100%;padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lock .ico{font-size:30px}.lock h1{font-size:20px;margin:10px 0 4px;border:0;padding:0}
.lock p{color:var(--mut);font-size:13.5px;margin:0 0 18px}
.lock input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;outline:none}
.lock input:focus{border-color:var(--acc)}
.lock button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:var(--acc);color:#fff;font-weight:650;font-size:15px;cursor:pointer}
.lock .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
#bar{position:sticky;top:0;z-index:20;display:none;justify-content:flex-end;gap:8px;padding:9px 14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bar button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.banner{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:13.5px;color:var(--ink)}
@media(max-width:560px){.wrap{padding:20px 14px 80px}h1{font-size:25px}}
</style>
</head>
<body>
<div id="gate"><div class="lock">
<div class="ico">🔒</div>
<h1>Protected business plan</h1>
<p>This document is end-to-end encrypted. Enter the password to read it. Nothing is stored or sent anywhere — decryption happens only in your browser.</p>

<button id="go">Unlock</button>
<div id="err" class="err"></div>
</div></div>
<div id="bar"><button onclick="tog()">◐ Theme</button></div>

const $=s=>document.querySelector(s);
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function unlock(){
  const pw=$('#pw').value; if(!pw){return}
  $('#err').textContent='';
  try{
    const raw=b64(ENC), salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITERS,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    $('#gate').style.display='none'; $('#bar').style.display='flex';
    window.scrollTo(0,0);
  }catch(e){$('#err').textContent='Wrong password. Try again.'; $('#pw').value=''}
}
function tog(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')}
window.addEventListener('DOMContentLoaded',()=>{
  $('#go').addEventListener('click',unlock);
  $('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  $('#pw').focus();
});
</script>
